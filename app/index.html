<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QurwaLingo</title>
</head>
<body>

    <!-- HORNI LISTA -->
    <header id="app-header">
        <h1 id="lesson-title">Načítám lekci...</h1>
        <div id="stats-bar">
            <span>Karta: <strong id="progress-text">0 / 0</strong></span> |
            <span>Životy: <strong id="lives-count">5</strong></span> |
            <span>Skóre: <strong id="score-count">0</strong></span>
        </div>
        <hr>
    </header>

    <!-- HLAVNI VYUKOVA PLOCHA -->
    <main id="quiz-container">

        <!-- Flashcard s odhalením kontextu -->
        <section id="task-flashcard" hidden>
            <h2>Seznámení s výrazem</h2>
            <p>Originál (SK): <strong id="fc-original"></strong></p>
            <button type="button" id="btn-fc-reveal">Ukázat překlad a kontext</button>

            <div id="fc-back" hidden>
                <p>Překlad (CZ): <strong id="fc-translation"></strong></p>
                <p>Příklad: <em id="fc-context"></em></p>
                <button type="button" id="btn-fc-next">Rozumím, jdeme dál</button>
            </div>
        </section>

        <!-- Multiple Choice -->
        <section id="task-mcq" hidden>
            <h2>Vyber správný překlad</h2>
            <p>Co znamená: <strong id="mcq-original"></strong>?</p>
            <div id="mcq-options">
                <!-- Zde se vygeneruji 4 buttomy -->
            </div>
        </section>

        <!-- Doplnovani chybejiciho slova do vety -->
        <section id="task-cloze" hidden>
            <h2>Doplň chybějící výraz do věty</h2>
            <p>Význam: <span id="cloze-hint"></span></p>
            <p id="cloze-sentence"></p>
            <form id="cloze-form">
                <input type="text" id="cloze-input" placeholder="Napiš chybějící tvar..." autocomplete="off" required>
                <button type="submit" id="btn-cloze-submit">Zkontrolovat</button>
            </form>
        </section>

        <!-- vyhodnoceni odpovedi -->
        <section id="feedback-box" hidden>
            <hr>
            <h3 id="feedback-status"></h3>
            <p id="feedback-explanation"></p>
            <button type="button" id="btn-next-card">Pokračovat</button>
        </section>

    </main>

    <!-- SOUHRN PO DOKONCENI  -->
    <section id="summary-screen" hidden>
        <h2 id="summary-heading">Lekce dokončena!</h2>
        <p>Správné odpovědi: <strong id="summary-score"></strong></p>
        <p>Úspěšnost: <strong id="summary-accuracy"></strong></p>
        <p>Získané XP: <strong id="summary-xp"></strong></p>
        <button type="button" id="btn-restart">Zkusit lekci znovu</button>
    </section>

    <!-- Jadro -->
    <script src="js/engine.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
